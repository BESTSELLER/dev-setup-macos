name: macOS Install Test

on:
  schedule:
    - cron: "37 13 * * *"
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Brew update / upgrade
        shell: bash
        run: |
          brew update
          brew upgrade

      - name: Run install script
        shell: bash
        run: |
          ./install.sh
